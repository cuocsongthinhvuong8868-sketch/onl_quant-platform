name: Fed Liquidity Weekly Update

# Fed phát hành báo cáo H.4.1 (chứa WALCL) vào chiều Thứ 5 hằng tuần (~16:30 ET = 20:30 UTC).
# Chúng ta chạy lúc 22:00 UTC Thứ 5 = 05:00 VN sáng Thứ 6 — đủ trễ để dữ liệu mới đã được publish.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 4'

permissions:
  contents: write

jobs:
  update-fed-liquidity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run update_fed_liquidity.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python command/update_fed_liquidity.py

      - name: Build AI-CIO data catalog
        run: python command/build_ai_cio_data_catalog.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data_lake/fed_liquidity_cache.csv data_lake/ai_cio_data_catalog.json

          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update fed_liquidity_cache.csv [skip ci]"
            git push
            echo "✅ Pushed updated Fed Liquidity cache."
          else
            echo "ℹ️ No changes in fed_liquidity_cache.csv. Skipping commit."
          fi
