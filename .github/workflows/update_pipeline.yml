name: Quant Data Auto-Update Pipeline

on:
  workflow_dispatch: # Vẫn giữ dòng này để lúc nào thích thì bấm chạy bằng tay
  schedule:
    # Chạy tự động vào lúc 16:00 giờ Việt Nam (tức 09:00 UTC), từ Thứ 2 đến Thứ 6
    - cron: '0 9 * * 1-5'

permissions:
  contents: write

jobs:
  run-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- BƯỚC MỚI: TẠO FILE .ENV TỪ GITHUB SECRETS ---
      - name: Create .env file
        run: |
          echo "MY_API_KEY=${{ secrets.MY_API_KEY }}" >> .env
          # Nếu bạn có nhiều biến khác, hãy copy dòng trên và đổi tên, ví dụ:
          # echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          # echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env

      - name: Run update_data.py
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python command/update_data.py

      - name: Run update_bank_fundamentals.py
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python command/update_bank_fundamentals.py
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update quant data files"
            git push
            echo "Successfully pushed new data to repository."
          else
            echo "No data changes detected. Skipping commit."
          fi
