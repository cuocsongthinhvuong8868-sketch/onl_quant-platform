name: Quant Data Auto-Update Pipeline

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Số ngày backfill (vd: 2190 ~ 6 năm). Để trống = incremental.'
        required: false
        default: ''
      from_date:
        description: 'Backfill từ ngày cụ thể (YYYY-MM-DD). Để trống = incremental.'
        required: false
        default: ''
  schedule:
        # Chạy tự động lúc 14:30 (2:30 PM) giờ Việt Nam (07:30 UTC), từ Thứ 2 đến Thứ 6
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

jobs:
  run-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- TẠO FILE .ENV TỪ GITHUB SECRETS ---
      - name: Create .env file
        run: |
          echo "MY_API_KEY=${{ secrets.MY_API_KEY }}" >> .env
          # Nếu bạn có nhiều biến khác, hãy copy dòng trên và đổi tên, ví dụ:
          # echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          # echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env

      - name: Run update_data.py (incremental / backfill)
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.backfill_days }}" ]; then
            echo "Backfill mode: ${{ github.event.inputs.backfill_days }} days"
            python command/update_data.py --backfill ${{ github.event.inputs.backfill_days }}
          elif [ -n "${{ github.event.inputs.from_date }}" ]; then
            echo "Backfill mode: from ${{ github.event.inputs.from_date }}"
            python command/update_data.py --from-date ${{ github.event.inputs.from_date }}
          else
            echo "Incremental mode: chỉ tải ngày mới"
            python command/update_data.py
          fi

      - name: Validate Risk-Adjusted Growth bank statistics feed
        run: |
          python - <<'PY'
          from tools.risk_adjusted_growth.quant.data_prep import load_statistics_ratio_table
          df = load_statistics_ratio_table()
          print(f"Risk-Adjusted Growth bank feed rows: {len(df)}")
          if len(df) < 10:
              raise SystemExit("Risk-Adjusted Growth bank feed has too few rows")
          if not df["Cash Payout Source"].astype(str).str.contains("cash_flow_dividends_paid_20q").all():
              raise SystemExit("Risk-Adjusted Growth payout feed is not cash-flow based")
          PY

      - name: Pre-warm Factor Examination pkl
        run: python command/update_factor_examination.py

      - name: Run update_vnibor.py
        run: python command/update_vnibor.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage cụ thể data_lake để tránh dính .env hay file rác
          git add data_lake/

          if git diff --cached --quiet; then
            echo "No data changes detected. Skipping commit."
            exit 0
          fi
          git commit -m "Auto-update quant data files"
          # Retry push với pull --rebase để xử lý race condition với workflow khác
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Push thành công (attempt $attempt)"
              exit 0
            fi
            echo "⚠️  Push bị reject (attempt $attempt/5) — pulling với rebase..."
            git pull --rebase --autostash origin main || {
              echo "❌ Rebase fail, abort"
              git rebase --abort || true
            }
            sleep $((attempt * 3))
          done
          echo "❌ Push fail sau 5 lần thử"
          exit 1
