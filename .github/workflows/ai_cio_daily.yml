name: 🤖 AI CIO Daily Report (DeepSeek)

on:
  schedule:
    # 3:00 AM VN Time (UTC+7) = 20:00 UTC previous day
    # Mon-Fri VN => Sun-Thu UTC
    - cron: '0 8 * * 1-5'
  workflow_dispatch:  # allow manual trigger

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: 🤖 Run AI CIO Auto
        run: python command/run_ai_cio_auto.py

      - name: 📤 Commit cache + PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_lake/daily_cache/ reports/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: AI CIO report $(date +'%d%m%y')"
            git push
          fi
