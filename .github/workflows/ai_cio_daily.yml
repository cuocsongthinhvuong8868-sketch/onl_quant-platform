name: 🤖 AI CIO Daily Report (DeepSeek)

on:
  schedule:
    # 14:45 (2:45 PM) VN Time (UTC+7) = 07:45 UTC — chạy sau update data (14:30)
    # Thứ 2 đến Thứ 6
    - cron: '45 7 * * 1-5'
  workflow_dispatch:  # allow manual trigger

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: 🔍 Kiểm tra dữ liệu VNINDEX đã cập nhật hôm nay chưa?
        id: check_data
        run: |
          python -c '
          import pandas as pd
          import os
          from datetime import date

          df = pd.read_csv("data_lake/vnindex_cache.csv", parse_dates=["time"])
          today_str = date.today().strftime("%Y-%m-%d")
          latest_date = df["time"].max().strftime("%Y-%m-%d")
          print(f"Latest data date: {latest_date}")
          print(f"Today: {today_str}")

          is_ready = "true" if latest_date >= today_str else "false"
          github_output = os.getenv("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"DATA_READY={is_ready}\n")
          '

      - name: 📥 Cập nhật dữ liệu (nếu thiếu)
        if: steps.check_data.outputs.DATA_READY == 'false'
        run: |
          echo "Dữ liệu chưa cập nhật hôm nay. Đang chạy update_data.py..."
          python command/update_data.py
          python command/update_bank_fundamentals.py

      - name: 🤖 Chạy AI CIO (force — không dùng cache cũ của tool con)
        run: python command/run_ai_cio_auto.py --force

      - name: 📤 Commit cache + PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_lake/daily_cache/ data_lake/Ai_cio_report.csv reports/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto: AI CIO report $(date +'%d%m%y')"
          # Retry push với pull --rebase để xử lý race condition
          # (khi workflow khác push song song trong lúc job này chạy)
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Push thành công (attempt $attempt)"
              exit 0
            fi
            echo "⚠️  Push bị reject (attempt $attempt/5) — pulling với rebase..."
            git pull --rebase --autostash origin main || {
              echo "❌ Rebase fail, abort và retry"
              git rebase --abort || true
            }
            sleep $((attempt * 3))
          done
          echo "❌ Push fail sau 5 lần thử"
          exit 1

