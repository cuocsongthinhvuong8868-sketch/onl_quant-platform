name: News Sentiment Factor Feed Daily

on:
  workflow_dispatch:
  schedule:
    # 14:00 Vietnam time (UTC+7) = 07:00 UTC. GitHub scheduled runs can be delayed under load.
    - cron: '0 7 * * *'

permissions:
  contents: write

concurrency:
  group: sentiment-factor-news-feed
  cancel-in-progress: false

jobs:
  update-sentiment-factor-news:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      WIDATA_SIGN_TOKEN: ${{ secrets.WIDATA_SIGN_TOKEN }}
      MOZYFIN_API_BASE: https://api.mozyfin.com/api/v2
      MOZYFIN_ACCESS_TOKEN: ${{ secrets.MOZYFIN_ACCESS_TOKEN }}
      MOZYFIN_TOKEN: ${{ secrets.MOZYFIN_TOKEN }}
      MOZYFIN_API_KEY: ${{ secrets.MOZYFIN_API_KEY }}
      MOZYFIN_COOKIES_JSON: ${{ secrets.MOZYFIN_COOKIES_JSON }}
      MOZYFIN_NEXT_ACTION_ID: ${{ secrets.MOZYFIN_NEXT_ACTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Mozyfin news feed
        run: python command/update_sentiment_factor_news.py --once --source mozyfin --limit-mozyfin 1000

      - name: Run WiData market signal feed
        run: python command/update_sentiment_factor_news.py --once --source widata --limit-widata 500

      - name: Validate generated sentiment feed
        run: |
          python - <<'PY'
          from tools.sentiment_factor_news.report import snapshot
          for window in ("1d", "7d", "30d"):
              snap = snapshot(window=window)
              print(window, snap["status"], snap.get("regime"), snap.get("macro_composite"), snap.get("news_count"))
              if snap["status"] != "ok":
                  raise SystemExit(f"Sentiment feed {window} not ready: {snap.get('error')}")
          PY

      - name: Commit and push feed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data_lake/sentiment_factor_news/feed/ data_lake/sentiment_factor_news/history/

          if git diff --cached --quiet; then
            echo "No sentiment feed changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "Auto-update sentiment factor news feed [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt/5; pulling with rebase..."
            git pull --rebase --autostash origin main || {
              echo "Rebase failed; aborting and retrying."
              git rebase --abort || true
            }
            sleep $((attempt * 3))
          done
          echo "Push failed after 5 attempts."
          exit 1
